name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 빌드와 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "*/build/reports/tests/**"
          retention-days: 7

  build:
    name: 이미지 빌드
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [producer]
    outputs:
      tag: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :${{ matrix.module }}:bootJar --no-daemon

      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }}
          file: ${{ matrix.module }}/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/seol-jy/marketpulse-${{ matrix.module }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: GitOps 태그 갱신
    needs: build
    runs-on: ubuntu-latest
    concurrency: marketpulse-deploy
    strategy:
      matrix:
        module: [producer]
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Seol-JY/seol-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: 이미지 태그 갱신
        env:
          IMAGE: ghcr.io/seol-jy/marketpulse-${{ matrix.module }}
          TAG: ${{ needs.build.outputs.tag }}
          MODULE: ${{ matrix.module }}
        run: |
          yq -i '(.images[] | select(.name == strenv(IMAGE)) | .newTag) = strenv(TAG)' "apps/marketpulse-${MODULE}/kustomization.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "변경 없음"; exit 0; fi
          git commit -am "chore(marketpulse-${MODULE}): 이미지 태그 ${TAG} 갱신"
          git push
