name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Testcontainers 용 러너 Docker 그대로 사용
      - run: ./gradlew build --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "*/build/reports/tests/**"
          retention-days: 7

  image:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [producer]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :${{ matrix.module }}:bootJar --no-daemon
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr 은 소문자만 받는데 owner 가 대문자를 포함함
      - id: image
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/marketpulse-${{ matrix.module }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }}
          file: ${{ matrix.module }}/Dockerfile
          push: true
          # 태그는 커밋 SHA 고정. latest 미사용으로 롤백 지점 명확
          tags: ${{ steps.image.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 요약
        env:
          IMAGE: ${{ steps.image.outputs.repo }}:${{ github.sha }}
        run: |
          {
            echo "### 이미지 배포됨"
            echo '```'
            echo "$IMAGE"
            echo '```'
            echo "GitOps 레포의 kustomization.yaml 에서 newTag 를 \`${GITHUB_SHA:0:7}\` 로 바꾸면 배포된다"
          } >> "$GITHUB_STEP_SUMMARY"
